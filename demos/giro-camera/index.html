<title>Giro da Câmera</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: palco largo com o carro no chão, controles compactos abaixo. Escuro por padrão (pista à noite), claro opcional. */
:root{
  --bg:#ece9e4; --panel:#f6f4f0; --fg:#1d1a17; --muted:#6b645c; --line:#d6d1c9;
  --accent:#e0661a; --accent-fg:#fff; --road:#c9c4bc; --road-line:#f1efe9; --shadow:rgba(20,16,12,.35);
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14120f; --panel:#1d1a16; --fg:#f0ece6; --muted:#9b9388; --line:#322d27;
  --accent:#ff7a2a; --accent-fg:#1a0f06; --road:#25221e; --road-line:#3a352e; --shadow:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14120f; --panel:#1d1a16; --fg:#f0ece6; --muted:#9b9388; --line:#322d27;
  --accent:#ff7a2a; --accent-fg:#1a0f06; --road:#25221e; --road-line:#3a352e; --shadow:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:960px;margin:0 auto;display:grid;gap:16px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,6vw,44px);letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.sub{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.stage{position:relative;aspect-ratio:21/10;background:linear-gradient(var(--panel) 0 62%,var(--road) 62% 100%);border:1px solid var(--line);
  border-radius:6px;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.stage.drag{cursor:grabbing}
.stage::before{content:"";position:absolute;left:0;right:0;top:62%;height:2px;background:var(--road-line)}
.lane{position:absolute;left:0;right:0;top:82%;height:3px;background:repeating-linear-gradient(90deg,var(--road-line) 0 38px,transparent 38px 86px);opacity:.8}
.shadow{position:absolute;left:50%;top:84%;width:60%;height:7%;transform:translateX(-50%);background:radial-gradient(closest-side,var(--shadow),transparent);filter:blur(2px)}
.stage img{position:absolute;left:0;bottom:3%;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.badge{position:absolute;left:12px;top:10px;font-family:var(--mono);font-size:12px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.badge b{color:var(--accent);font-weight:600}
.hint{position:absolute;left:12px;bottom:8px;font-family:var(--mono);font-size:12px;color:var(--muted);transition:opacity .4s}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:grid;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-weight:600;min-height:44px;padding:0 16px;border-radius:4px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.slider{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;font-family:var(--mono);font-size:13px;color:var(--muted)}
input[type=range]{width:100%;min-width:0;accent-color:var(--accent);height:32px}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.chips button{min-height:40px;font-size:13px;font-weight:500;padding:0 8px;font-variant-numeric:tabular-nums}
.chips button span{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400}
.chips button.on span{color:inherit;opacity:.75}
.note{font-size:14px;color:var(--muted);margin:0}
.note b{color:var(--fg);font-weight:600}
@media (max-width:560px){.stage{aspect-ratio:16/9}}
@media (prefers-reduced-motion:reduce){.hint{transition:none}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@700&family=IBM+Plex+Mono:wght@400;600&display=swap">

<div class="wrap">
  <header>
    <h1>Giro da câmera</h1>
    <span class="sub">Honda laranja · 8 direções</span>
  </header>

  <div class="stage" id="stage" role="img" aria-label="Carro girando 360 graus">
    <div class="lane"></div><div class="shadow"></div>
    <img id="a" alt=""><img id="b" alt="">
    <div class="badge" id="badge">—</div>
    <div class="hint" id="hint">arraste para girar</div>
  </div>

  <div class="panel">
    <div class="slider"><span>0°</span><input id="ang" type="range" min="0" max="359" step="1" value="0" aria-label="Ângulo da câmera"><span id="angv">0°</span></div>
    <div class="row">
      <button id="left" aria-label="Girar para a esquerda">◀ Girar</button>
      <button id="right" aria-label="Girar para a direita">Girar ▶</button>
      <button id="auto" aria-pressed="false">Girar sozinho</button>
      <button id="smooth" class="on" aria-pressed="true">Transição suave</button>
    </div>
    <div class="chips" id="chips"></div>
    <p class="note"><b>Câmera do jogo:</b> começa atrás do carro (0°) e gira em volta dele. Nesta demo cada ângulo é uma das 8 imagens; a transição suave só mistura duas vizinhas. Nenhuma imagem sua foi redesenhada.</p>
  </div>
</div>

<script>
const DIRS=[
  [0,'Traseira'],[45,'Traseira 3/4 direita'],[90,'Lateral direita'],[135,'Frente 3/4 direita'],
  [180,'Frente'],[225,'Frente 3/4 esquerda'],[270,'Lateral esquerda'],[315,'Traseira 3/4 esquerda']];
const A=document.getElementById('a'),B=document.getElementById('b'),stage=document.getElementById('stage');
const ang=document.getElementById('ang'),angv=document.getElementById('angv'),badge=document.getElementById('badge'),hint=document.getElementById('hint');
const chips=document.getElementById('chips');
let az=0,smooth=true,auto=false,dragging=false,lastX=0;
const src=i=>'img/car_'+String(DIRS[((i%8)+8)%8][0]).padStart(3,'0')+'.webp';
DIRS.forEach(([d,n],i)=>{const b=document.createElement('button');b.innerHTML=n+'<span>'+d+'°</span>';b.onclick=()=>{auto=false;syncAuto();snap(d)};b.dataset.i=i;chips.appendChild(b);new Image().src=src(i)});
const ease=t=>t*t*(3-2*t);
function render(){
  az=((az%360)+360)%360;
  const i=Math.floor(az/45),f=(az-i*45)/45;
  A.src=src(i);B.src=src(i+1);
  A.style.opacity=1;
  B.style.opacity=smooth?ease(Math.min(1,Math.max(0,(f-.38)/.24))):(f>=.5?1:0);
  if(!smooth&&f>=.5){A.style.opacity=0}
  const near=Math.round(az/45)%8;
  badge.innerHTML='<b>'+Math.round(az)+'°</b> · '+DIRS[near][1];
  ang.value=Math.round(az)%360;angv.textContent=Math.round(az)%360+'°';
  [...chips.children].forEach((b,k)=>b.classList.toggle('on',k===near));
}
function snap(t){const from=az;let d=((t-from+540)%360)-180;const t0=performance.now(),dur=420;
  (function s(now){const p=Math.min(1,(now-t0)/dur);az=from+d*ease(p);render();if(p<1)requestAnimationFrame(s)})(t0)}
function syncAuto(){const b=document.getElementById('auto');b.classList.toggle('on',auto);b.setAttribute('aria-pressed',auto)}
stage.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;stage.classList.add('drag');stage.setPointerCapture(e.pointerId);auto=false;syncAuto();hint.style.opacity=0});
stage.addEventListener('pointermove',e=>{if(!dragging)return;az-=(e.clientX-lastX)*(360/stage.clientWidth)*0.9;lastX=e.clientX;render()});
['pointerup','pointercancel'].forEach(t=>stage.addEventListener(t,()=>{dragging=false;stage.classList.remove('drag')}));
ang.oninput=()=>{auto=false;syncAuto();az=+ang.value;render()};
document.getElementById('left').onclick=()=>{auto=false;syncAuto();snap(Math.round(az/45)*45-45)};
document.getElementById('right').onclick=()=>{auto=false;syncAuto();snap(Math.round(az/45)*45+45)};
document.getElementById('auto').onclick=()=>{auto=!auto;syncAuto()};
document.getElementById('smooth').onclick=e=>{smooth=!smooth;e.currentTarget.classList.toggle('on',smooth);e.currentTarget.setAttribute('aria-pressed',smooth);render()};
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){az-=5;render()}if(e.key==='ArrowRight'){az+=5;render()}});
let last=performance.now();
(function tick(now){if(auto&&!dragging){az+=(now-last)*0.03;render()}last=now;requestAnimationFrame(tick)})(last);
render();
</script>
